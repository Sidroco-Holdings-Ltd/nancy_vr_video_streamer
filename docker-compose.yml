services:
  video-server:
    image: ghcr.io/nntamp/nancy-video-server:latest
    container_name: video-server
    ports:
      - "8080:80"
    volumes:
      - ./videos:/usr/share/nginx/videos
      - ./logs:/var/log/nginx
    environment:
      # video storage URL should be placed HERE
      - VIDEO_SOURCE_URL=https://drive.google.com/file/d/1SLjNNWPgGoCbjtxyelZl4QZIGtXoTAf0/view?usp=sharing,https://drive.google.com/file/d/1dNkhvsnTSdVmVCgvaa8_YEY8LIMxxB0D/view?usp=sharing
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      - nancy-grpc-server-side
  nancy-grpc-client-side:
    image: nancy-grpc
    container_name: nancy-grpc-client-side
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - GRPC_HOST=${GRPC_HOST:-195.37.154.23}
      - GRPC_PORT=${GRPC_PORT:-8881}
      - UVICORN_HOST=${UVICORN_HOST:-0.0.0.0}
      - UVICORN_PORT=${UVICORN_PORT:-8000}
      - API_TITLE=${API_TITLE:-DLT Gateway REST API client-side}
  nancy-grpc-server-side:
    image: nancy-grpc
    container_name: nancy-grpc-server-side
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - GRPC_HOST=${GRPC_HOST:-195.37.154.23}
      - GRPC_PORT=${GRPC_PORT:-8881}
      - UVICORN_HOST=${UVICORN_HOST:-0.0.0.0}
      - UVICORN_PORT=${UVICORN_PORT:-8000}
      - API_TITLE=${API_TITLE:-DLT Gateway REST API server-side}
