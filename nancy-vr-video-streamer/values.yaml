# Default values for nancy-vr-video-streamer
global:
  imageRegistry: ghcr.io/sidroco-holdings-ltd
  
# Video Server Configuration
videoServer:
  replicaCount: 1
  image:
    repository: nancy-video-server
    tag: "latest"
  service:
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Health check configuration for video server
  # The video server needs time to download videos before nginx starts
  livenessProbe:
    initialDelaySeconds: 120  # Wait 2 minutes before first check
    periodSeconds: 30         # Check every 30 seconds
    timeoutSeconds: 5         # Allow 5 seconds for response
    failureThreshold: 3       # Allow 3 failures before restart
  
  readinessProbe:
    initialDelaySeconds: 120  # Wait 2 minutes before first check
    periodSeconds: 10         # Check every 10 seconds
    timeoutSeconds: 5         # Allow 5 seconds for response
    failureThreshold: 3       # Allow 3 failures before marking as not ready

# gRPC Services Configuration
grpcServices:
  # Common settings for all gRPC services
  image:
    repository: nancy-grpc
    tag: "latest"
  
  # Client-side gRPC service (matches docker-compose nancy-grpc-client-side)
  client:
    enabled: true
    replicaCount: 1
    service:
      port: 8000
      targetPort: 8000
    env:
      GRPC_PORT: "50001"
      API_TITLE: "DLT Gateway REST API client-side"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
  
  # Server-side gRPC service (matches docker-compose nancy-grpc-server-side)
  server:
    enabled: true
    replicaCount: 1
    service:
      port: 8000
      targetPort: 8000
    env:
      GRPC_PORT: "50000"
      API_TITLE: "DLT Gateway REST API server-side"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

# Persistent Volume Claims
persistence:
  videos:
    size: 10Gi
  logs:
    size: 1Gi

# ConfigMap values
config:
  videoSourceUrl: "https://drive.google.com/file/d/1SLjNNWPgGoCbjtxyelZl4QZIGtXoTAf0/view?usp=sharing,https://drive.google.com/file/d/1dNkhvsnTSdVmVCgvaa8_YEY8LIMxxB0D/view?usp=sharing"
  grpcHost: "10.10.10.40"
